 else if(ui.tTab==='llaves')body=c.rounds.length?`<div class="panel">${bracketView(c.rounds)}</div>`:`<div class="panel empty">Las llaves se arman solas cuando termine la fase de grupos: clasifican los ${t.advance} primeros de cada grupo.</div>`;
 else if(ui.tTab==='tabla')body=`<div class="panel"><h2>Tabla${t.format==='suizo'?`<span class="count">${c.rounds.length} de ${t.rounds} rondas</span>`:''}</h2>${groupTable(c.table,0)}${c.byes.length?`<p class="sub" style="margin:10px 0 0">Descansos (suman 3 puntos): ${c.byes.map(b=>'ronda '+(b.round+1)+': '+esc(b.player)).join(' · ')}</p>`:''}</div>`;
 else if(ui.tTab==='info')body=`<div class="grid-2"><div class="stack"><div class="panel"><h2>${ic('list')}Reglas del torneo</h2>${t.rules?`<p class="rules">${esc(t.rules)}</p>`:'<p class="sub" style="margin:0">Todavía no hay reglas publicadas.</p>'}</div><div class="panel"><h2>${ic('bracket')}Criterio de desempate</h2><ol class="tb-list">${tbOrder(t.tiebreak).map((k,i)=>`<li>${i===0?'<b>':''}${TBL[k]}${i===0?'</b> (principal)':''}</li>`).join('')}</ol><p class="sub" style="margin:8px 0 0">Se aplica cuando dos o más jugadores terminan con los mismos puntos.</p></div></div>
  <div class="stack">${t.prize&&t.prize.on?prizeHTML(t.prize):`<div class="panel"><h2>${ic('trophy')}Premio</h2><p class="sub" style="margin:0">Este torneo no tiene premio${ext?'':`; el campeón suma +${bonusFor(t.format)} puntos al ranking`}.</p></div>`}<div class="panel"><h2>${ic('image')}Imagen del torneo</h2><img class="promo-img" src="${BLANK}" data-promo="t:${t.id}" alt="Imagen promocional de ${esc(t.name)}" style="border-radius:10px"><div class="row" style="margin-top:10px">${DL?`<button class="btn sm" data-act="promo-dl" data-k="t:${t.id}">${ic('download')}Descargar imagen</button>`:'<span class="sub">En el celular mantén presionada la imagen para guardarla.</span>'}</div></div></div></div>`;
 else{const groups={};np.forEach(f=>{const k=stageLabel(f);(groups[k]=groups[k]||[]).push(f)});body=`<div class="stack">${Object.entries(groups).map(([k,fs])=>`<div class="panel"><h2>${esc(k)}</h2><div class="mlist">${fs.map(fixtureLine).join('')}</div></div>`).join('')||'<div class="panel empty">No hay partidos todavía.</div>'}</div>`}
 const played=np.filter(f=>f.match).length;
 return `<div class="page-head"><div><button class="linkbtn" data-act="back-t" style="padding-left:0">← Todos los torneos</button><div class="eyebrow" style="margin-top:6px">${FMT[t.format]}${t.legs===2?' · ida y vuelta':''}</div><h1>${esc(t.name)}</h1><p>${t.order.length} jugadores · ${played} de ${np.length} partidos jugados · desempate: ${TBL[t.tiebreak||'dg'].toLowerCase()}</p></div>${isAdmin()?`<div class="row"><button class="btn sm" data-act="edit-t" data-id="${t.id}">${ic('edit')}Modificar torneo</button><button class="btn danger sm" data-act="del-t" data-id="${t.id}">${ic('trash')}Eliminar</button></div>`:''}</div>
 <div class="note">${ic(ext?'info':'trophy')}<div>${ext?'<b>Torneo externo.</b> Sus partidos no cuentan para ningún ranking ni para las estadísticas.':`<b>Válido para la comunidad.</b> Sus partidos suman al ranking y a las estadísticas; el campeón recibe <b>+${bonusFor(t.format)} puntos</b>.`}${t.prize&&t.prize.on?` <b>Premio:</b> ${esc(t.prize.first)}${t.prize.second?` · 2.º: ${esc(t.prize.second)}`:''}.`:''}</div></div>
 ${c.finished?`<div class="champ-banner">${av(c.champion,56)}<div><div class="t1">Campeón</div><div class="t2">${esc(c.champion)}</div><div class="sub">Subcampeón: ${esc(c.runnerUp||'—')}</div></div><button class="btn primary" data-act="champ-img" data-id="${t.id}">${ic('crown')}Imagen de campeón</button></div>`:''}
 <div class="seg" role="group" aria-label="Vista del torneo" style="margin-bottom:16px">${tabs.map(([k,l])=>`<button data-act="t-tab" data-k="${k}" aria-pressed="${ui.tTab===k}">${l}</button>`).join('')}</div>${body}`}

/* formulario de torneo (crear y modificar) */
const gl={nt:[],et:[]};
function extraFields(p,o={},withTb=true){const pz=o.prize||{};return `${withTb?`<div class="field"><label for="${p}Tb">Criterio de desempate</label><select id="${p}Tb">${['dg','gf','h2h'].map(k=>`<option value="${k}" ${(o.tiebreak||'dg')===k?'selected':''}>${TBL[k]}${k==='dg'?' (predeterminado)':''}</option>`).join('')}</select><span class="hint">Se usa primero cuando hay empate en puntos; luego siguen los otros dos.</span></div>`:''}
 <label class="chk"><input type="checkbox" id="${p}Prize" ${pz.on?'checked':''}> Este torneo tiene premio</label>
 <div class="fgrid two" id="${p}PrizeBox" ${pz.on?'':'hidden'}><div class="field"><label for="${p}P1">Premio del 1.er lugar</label><input type="text" id="${p}P1" maxlength="80" value="${esc(pz.first||'')}" placeholder="Ej.: ₡20 000 y trofeo"></div><div class="field"><label for="${p}P2">Premio del 2.º lugar (opcional)</label><input type="text" id="${p}P2" maxlength="80" value="${esc(pz.second||'')}" placeholder="Déjalo vacío si solo hay premio para el campeón"></div></div>
 <div class="field"><label for="${p}Rules">Reglas del torneo</label><textarea id="${p}Rules" maxlength="3000" placeholder="Ej.: Partidos de 6 minutos, condición física excelente, sin pausas salvo desconexión…">${esc(o.rules||'')}</textarea></div>`}
function readExtra(p,withTb=true){const on=$('#'+p+'Prize').checked,first=$('#'+p+'P1').value.trim(),second=$('#'+p+'P2').value.trim();if(on&&!first)return {err:'Describe el premio del primer lugar o desmarca la casilla de premio.'};const o={prize:{on,first:on?first:'',second:on?second:''},rules:$('#'+p+'Rules').value.trim()};if(withTb)o.tiebreak=$('#'+p+'Tb').value;return o}
function tournamentForm(p,t,pre={}){const src=t||pre;const off=src.official!==false;const played=!!t&&S.matches.some(m=>m.tid===t.id&&['aprobado','pendiente'].includes(m.status));const ps=members().slice().sort((a,b)=>a.id.localeCompare(b.id));const sel=new Set(t?t.order:(pre.ids||[]));gl[p]=t?t.order.filter(isGuest):[];
 const struct=played?`<div class="note" style="margin:0">${ic('info')}<div>Este torneo ya tiene partidos, así que el formato y el sorteo quedan fijos. Si alguien se retira antes de jugar, puedes reemplazarlo.</div></div>
  <div class="fgrid two"><div class="field"><label for="${p}Out">Reemplazar a</label><select id="${p}Out"><option value="">Nadie</option>${t.order.filter(id=>!S.matches.some(m=>m.tid===t.id&&['aprobado','pendiente'].includes(m.status)&&(m.home===id||m.away===id))).map(id=>`<option value="${esc(id)}">${esc(id)}</option>`).join('')}</select><span class="hint">Solo aparecen quienes no han jugado en este torneo.</span></div><div class="field"><label for="${p}In">Por</label><select id="${p}In"><option value="">Elige un miembro</option>${ps.filter(x=>!t.order.includes(x.id)).map(x=>`<option value="${esc(x.id)}">${esc(x.id)}</option>`).join('')}</select></div></div>`
 :`<div class="field"><label for="${p}Fmt">Formato</label><select id="${p}Fmt">${['grupos','ko','liga','suizo'].map(k=>`<option value="${k}" ${src.format===k?'selected':''}>${FMT[k]}</option>`).join('')}</select><span class="hint" id="${p}Hint"></span></div>
 <div class="fgrid two"><div class="field" data-for="grupos liga"><label for="${p}Legs">Partidos por cruce</label><select id="${p}Legs"><option value="1">Solo ida</option><option value="2" ${src.legs===2?'selected':''}>Ida y vuelta</option></select></div>
 <div class="field" data-for="grupos"><label for="${p}Groups">Cantidad de grupos</label><select id="${p}Groups">${[2,4,8].map(n=>`<option ${t&&t.groups&&t.groups.length===n?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="field" data-for="grupos"><label for="${p}Adv">Clasifican por grupo</label><select id="${p}Adv">${[2,1,4].map(n=>`<option ${t&&t.advance===n?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="field" data-for="suizo"><label for="${p}Rounds">Rondas</label><select id="${p}Rounds">${[3,4,5,6,7].map(n=>`<option ${(t&&t.rounds?t.rounds===n:n===5)?'selected':''}>${n}</option>`).join('')}</select></div></div>
 <div class="field"><div class="row" style="justify-content:space-between"><span class="flabel">Jugadores de la comunidad <span id="${p}Count" class="num">(0)</span></span><button type="button" class="linkbtn" data-act="p-all" data-p="${p}">Seleccionar todos</button></div><div class="checks">${ps.map(x=>`<label><input type="checkbox" name="${p}P" value="${esc(x.id)}" ${sel.has(x.id)?'checked':''}><span>${esc(x.id)}</span></label>`).join('')}</div></div>
 <div class="field" id="${p}GuestBox" hidden><label for="${p}Guest">Invitados sin registro</label><div class="row" style="flex-wrap:nowrap"><input type="text" id="${p}Guest" maxlength="24" placeholder="ID o nombre del invitado"><button type="button" class="btn" data-act="g-add" data-p="${p}">${ic('plus')}Agregar</button></div><div class="guest-list" id="${p}GuestList"></div><span class="hint">Los invitados solo existen en este torneo: no pueden entrar a la página ni aparecen en los rankings.</span></div>
 ${t?`<label class="chk"><input type="checkbox" id="${p}Redraw"> Volver a sortear el orden y los grupos</label>`:'<span class="hint">El orden y los grupos se sortean al crear el torneo.</span>'}`;
 return `<form id="${p}Form" class="fgrid" novalidate>${t?`<input type="hidden" id="${p}Id" value="${t.id}">`:`<input type="hidden" id="${p}Ann" value="${esc(pre.ann||'')}">`}
 <div class="field"><label for="${p}Name">Nombre del torneo</label><input type="text" id="${p}Name" maxlength="40" placeholder="Ej.: Copa Clausura" value="${esc(src.name||'')}"></div>
 <div class="field"><span class="flabel">¿Cuenta para el ranking?</span><div class="radio-cards"><label><input type="radio" name="${p}Off" value="1" ${off?'checked':''}><span><b>Válido para la comunidad</b>Suma al ranking y a las estadísticas; el campeón gana bonificación.</span></label><label><input type="radio" name="${p}Off" value="0" ${off?'':'checked'}><span><b>Torneo externo</b>No cuenta para el ranking. Permite invitados sin registro.</span></label></div></div>
 ${struct}${extraFields(p,src)}
 <div class="err" id="${p}Err"></div><div class="modal-foot"><button type="button" class="btn ghost" data-act="close-modal">Cancelar</button><button class="btn primary" type="submit">${ic('check')}${t?'Guardar cambios':'Crear y sortear'}</button></div></form>`}
function mountTForm(p){return bg=>{const upd=()=>{const off=bg.querySelector(`[name=${p}Off]:checked`).value==='1';const fe=$('#'+p+'Fmt');if(fe){const f=fe.value;bg.querySelectorAll('[data-for]').forEach(el=>el.hidden=!el.dataset.for.split(' ').includes(f));$('#'+p+'GuestBox').hidden=off;
   $('#'+p+'Hint').textContent={grupos:'Grupos todos contra todos y luego llaves con los clasificados.',ko:'Llaves de un partido; el empate se define por penales. Si faltan jugadores para completar las llaves, algunos pasan directo.',liga:'Todos juegan contra todos; gana quien sume más puntos.',suizo:'Cada ronda enfrenta a jugadores con puntaje parecido, sin repetir rival.'}[f]+(off?` El campeón suma +${bonusFor(f)} puntos al ranking.`:'');
   $('#'+p+'Count').textContent='('+(bg.querySelectorAll(`[name=${p}P]:checked`).length+(off?0:gl[p].length))+')'}$('#'+p+'PrizeBox').hidden=!$('#'+p+'Prize').checked};bg.addEventListener('change',upd);bg._upd=upd;renderGuests(p);upd()}}
function newTournamentModal(pre={}){openModal('Crear torneo',tournamentForm('nt',null,pre),{wide:true,onMount:mountTForm('nt')})}
function editTournamentModal(id){const t=S.tournaments.find(x=>x.id===id);if(!t)return;openModal('Modificar torneo',tournamentForm('et',t),{wide:true,onMount:mountTForm('et')})}
function renderGuests(p){const el=$('#'+p+'GuestList');if(!el)return;el.innerHTML=gl[p].map((g,i)=>`<span class="pill mute">${esc(g)}<button type="button" data-act="g-rm" data-p="${p}" data-i="${i}" aria-label="Quitar a ${esc(g)}">${ic('x',14)}</button></span>`).join('');const bg=document.querySelector('.modal-back');if(bg&&bg._upd)bg._upd()}
function addGuest(p){const inp=$('#'+p+'Guest');const n=inp.value.trim().replace(/\s+/g,' ');const err=$('#'+p+'Err');err.textContent='';if(n.length<2)return err.textContent='El nombre del invitado debe tener al menos 2 caracteres.';
 const ex=S.players.find(x=>x.id.toLowerCase()===n.toLowerCase());if(ex&&!ex.guest)return err.textContent=`${ex.id} ya es miembro: márcalo en la lista de jugadores.`;if(gl[p].some(g=>g.toLowerCase()===n.toLowerCase()))return err.textContent='Ese invitado ya está en la lista.';
 gl[p].push(ex?ex.id:n);inp.value='';renderGuests(p);inp.focus()}
function structOpts(p){return {legs:+$('#'+p+'Legs').value,G:+$('#'+p+'Groups').value,A:+$('#'+p+'Adv').value,rounds:+$('#'+p+'Rounds').value}}
function buildStructure(t,ids,fmt,o){if(fmt==='ko'&&ids.length<2)return 'Elige al menos 2 jugadores.';if(fmt==='liga'&&ids.length<3)return 'Una liga necesita al menos 3 jugadores.';if(fmt==='suizo'&&ids.length<4)return 'El sistema suizo necesita al menos 4 jugadores.';if(fmt==='grupos'&&ids.length<o.G*Math.max(2,o.A+1))return `Con ${o.G} grupos y ${o.A} clasificados por grupo hacen falta al menos ${o.G*Math.max(2,o.A+1)} jugadores.`;
 const order=ids.slice().sort(()=>Math.random()-.5);t.format=fmt;t.order=order;t.legs=(fmt==='grupos'||fmt==='liga')?o.legs:1;delete t.groups;delete t.advance;delete t.rounds;
 if(fmt==='suizo')t.rounds=Math.min(o.rounds,ids.length-1);
 if(fmt==='grupos'){const G=o.G;t.groups=Array.from({length:G},()=>[]);order.forEach((id,i)=>{const r=Math.floor(i/G),gi=r%2?G-1-(i%G):i%G;t.groups[gi].push(id)});t.advance=o.A;t.order=t.groups.flat()}return null}
function createTournament(){const p='nt';const name=$('#ntName').value.trim(),fmt=$('#ntFmt').value,off=document.querySelector('[name=ntOff]:checked').value==='1',err=$('#ntErr');
 let ids=[...document.querySelectorAll('[name=ntP]:checked')].map(x=>x.value);if(!off)ids=ids.concat(gl.nt);
 if(!name)return err.textContent='Ponle un nombre al torneo.';if(S.tournaments.some(t=>t.name.toLowerCase()===name.toLowerCase()))return err.textContent='Ya existe un torneo con ese nombre.';

function anStats(){anTick();const from=anRange();const ss=AN.sessions.filter(s=>s.day>=from);const n=ss.length||1;
 const days={};const cur=new Date(from+'T00:00');const end=new Date();while(cur<=end){const k=cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(cur.getDate());days[k]={d:k,v:0,pv:0,u:new Set()};cur.setDate(cur.getDate()+1)}
 const sec={},hours=Array(24).fill(0),dev={},usr={},vis=new Set();let pv=0,dur=0,cl=0,bounce=0;
 ss.forEach(s=>{vis.add(s.v);pv+=s.pv;dur+=s.dur;if(s.pv<=1)bounce++;hours[s.hour]++;dev[s.dev]=(dev[s.dev]||0)+1;const dd=days[s.day];if(dd){dd.v++;dd.pv+=s.pv;dd.u.add(s.v)}

function adminTraffic(){const t=anStats();const maxSec=Math.max(1,...t.sec.map(s=>s.views));const maxH=Math.max(1,...t.hours);const devT=Object.values(t.dev).reduce((a,b)=>a+b,0)||1;const peak=t.hours.indexOf(maxH);
 return `<div class="note">${ic('info')}<div>Se mide a todos los visitantes automáticamente, con o sin sesión. Solo se guardan las secciones visitadas, el tiempo, los clics, la hora y el tipo de dispositivo. ${ui.anAt?'':'<b>Cargando las visitas…</b>'}</div></div>

function drawDays(el,days){if(!el)return;const W=Math.max(280,el.clientWidth),H=210,m={l:30,r:8,t:10,b:26};const max=Math.max(4,...days.map(d=>d.v));const step=max<=10?2:max<=40?10:max<=100?20:50;const ym=Math.ceil(max/step)*step;const Y=v=>H-m.b-v*(H-m.t-m.b)/ym;const bw0=(W-m.l-m.r)/days.length,bw=Math.max(2,bw0-2);

 el.innerHTML=s+'</svg>';el.querySelectorAll('.hb').forEach(r=>{const f=e=>{const d=days[+r.dataset.i];showTip(`<b>${fmtD(d.d)}</b><br>Visitas: <b>${d.v}</b> · Únicos: <b>${d.u.size}</b><br>Páginas vistas: <b>${d.pv}</b>`,e.clientX,e.clientY)};r.addEventListener('pointermove',f);r.addEventListener('pointerdown',f);r.addEventListener('pointerleave',hideTip)})}

 case 'album-del':{const al=S.albums.find(x=>x.id===id);confirmBox(`¿Eliminar el álbum <b>${esc(al.title)}</b> y sus ${al.photos.length} fotos?`,'Eliminar álbum',()=>{al.photos.forEach(phDel);S.albums=S.albums.filter(x=>x.id!==id);ui.albumId=null;logA('Eliminó el álbum '+al.title);save();render();toast('Álbum eliminado.')});break}

 case 'photo-del':{const al=S.albums.find(x=>x.id===id);const p=a.dataset.p;al.photos=al.photos.filter(x=>x!==p);if(al.cover===p)al.cover=al.photos[0]||null;phDel(p);save();closeModal();render();toast('Foto eliminada.');break}

 }});

 else if(f.id==='regForm'){const id=$('#rgId').value.trim().replace(/\s+/g,' '),pw=$('#rgPw').value,pw2=$('#rgPw2').value,err=$('#rgErr');if(!/^[A-Za-z0-9_.\- ]{3,24}$/.test(id))return err.textContent='El ID debe tener de 3 a 24 caracteres: letras, números, espacio, punto, guion o guion bajo.';if(pw.length<6)return err.textContent='La contraseña debe tener al menos 6 caracteres.';if(pw!==pw2)return err.textContent='Las contraseñas no coinciden.';

    setToken(r.token);regPhoto=null;await pull(true);closeModal();toast(isAdmin()?'¡Bienvenido! Ya tienes permisos de administrador.':r.claimed?'¡Listo! Tu historial ya está en tu cuenta.':'¡Bienvenido a Pes Costa Rica!');ui.forceEnter=true;if(location.hash!=='#inicio')location.hash='inicio';else render()}).catch(()=>{b.disabled=false;err.textContent='No hay conexión con el servidor. Intenta de nuevo.'})}
 else if(f.id==='pwForm'){const err=$('#pwErr'),o=$('#pwOld').value,n=$('#pwNew').value;if(n.length<6)return err.textContent='La nueva contraseña debe tener al menos 6 caracteres.';if(n!==$('#pwNew2').value)return err.textContent='Las contraseñas nuevas no coinciden.';err.textContent='';
   api('pescr_set_pass',{token:TOKEN,old:o,new:n}).then(r=>{if(r.error)return err.textContent=r.error==='bad'?'La contraseña actual no es correcta.':'No se pudo cambiar la contraseña.';f.reset();toast('Contraseña cambiada.')}).catch(()=>err.textContent='No hay conexión con el servidor.')}
 else if(f.id==='rpForm'){const err=$('#rpErr'),n=$('#rpPw').value.trim(),who=$('#rpId').value;if(n.length<6)return err.textContent='Mínimo 6 caracteres.';
   api('pescr_set_pass',{token:TOKEN,target:who,new:n}).then(r=>{if(r.error)return err.textContent='No se pudo cambiar la contraseña.';logA('Asignó una contraseña nueva a '+who);save();$('#rpBody').innerHTML=`<p style="margin:0">Listo. Envíale a <b>${esc(who)}</b> su nueva contraseña:</p><p class="num" style="font-size:26px;font-weight:800;margin:12px 0;user-select:all">${esc(n)}</p><p class="sub" style="margin:0">Puede cambiarla desde su perfil.</p><div class="modal-foot"><button class="btn primary" data-act="close-modal">Listo</button></div>`}).catch(()=>err.textContent='No hay conexión con el servidor.')}
 else if(f.id==='ntForm')createTournament();
 else if(f.id==='etForm')saveTournamentEdit();
 else if(f.id==='setForm'){const nb={};for(const k of ['grupos','ko','liga','suizo']){const v=$('#bn_'+k).value;if(v===''||!Number.isInteger(+v)||+v<0||+v>50)return $('#setErr').textContent='Las bonificaciones deben ser números enteros entre 0 y 50.';nb[k]=+v}const mf=$('#minF').value;if(!Number.isInteger(+mf)||+mf<1||+mf>200)return $('#setErr').textContent='El mínimo de amistosos debe estar entre 1 y 200.';const hd=+$('#hjD').value,hm=+$('#hjM').value;if(!Number.isInteger(hd)||hd<1||hd>20||!Number.isInteger(hm)||hm<1||hm>50)return $('#setErr').textContent='Revisa los valores del Hijómetro.';S.settings.bonus=nb;S.settings.minFriendly=+mf;S.settings.hjDiff=hd;S.settings.hjMin=hm;logA(`Cambió los puntos: grupos +${nb.grupos}, eliminación +${nb.ko}, liga +${nb.liga}, suizo +${nb.suizo}; mínimo amistosos ${mf}`);save();render();toast('Puntos guardados. El ranking ya se recalculó.')}
 else if(f.id==='emForm'){const m=S.matches.find(x=>x.id===$('#emId').value);const h=$('#emH').value,a=$('#emA').value;if(!goalsOk(h,a))return $('#emErr').textContent='Escribe goles entre 0 y 99.';const before=champSnapshot();const nst=$('#emSt').value;
   const ch={hg:+h,ag:+a,pen:(+h===+a)?($('#emPen').value||null):null,date:$('#emDate').value||m.date,status:nst,note:$('#emNote').value.trim()};if($('#emKind')){const k=$('#emKind').value;const tn=$('#emTn').value.trim();if(k!=='amistoso'&&!tn)return $('#emErr').textContent='Escribe el nombre del torneo.';ch.tname=k==='amistoso'?null:tn;ch.tofficial=k==='amistoso'?null:k==='oficial'}
   if(nst==='aprobado'&&m.tid)S.matches.forEach(x=>{if(x!==m&&x.tid===m.tid&&x.fkey===m.fkey&&['aprobado','pendiente'].includes(x.status))revise(x,{status:'rechazado'},'Reemplazado por otro resultado')});revise(m,ch,'Modificado por el admin');logA(`Modificó ${m.home} ${m.hg}–${m.ag} ${m.away} (${m.status})`);save();closeModal();render();afterChamp(before,'Cambios guardados. La versión anterior quedó en el historial.')}
 else if(f.id==='anForm'){const id=$('#anId').value;const title=$('#anTitle').value.trim(),date=$('#anDate').value,link=$('#anLink').value.trim();const err=$('#anErr');if(!title)return err.textContent='Ponle un nombre al torneo.';if(!date)return err.textContent='Elige la fecha del torneo.';if(link&&!/^https:\/\//.test(link))return err.textContent='El enlace debe empezar con https://';

   if(id){Object.assign(S.announcements.find(x=>x.id===id),d)}else S.announcements.push(Object.assign({id:'a'+uid(),registrants:[],created:todayStr()},d));logA(`${id?'Editó':'Publicó'} el anuncio ${title}`);save();closeModal();render();toast(id?'Anuncio actualizado.':'Anuncio publicado en la portada.')}
 else if(f.id==='alForm'){const id=$('#alId').value;const title=$('#alTitle').value.trim(),date=$('#alDate').value;if(!title)return $('#alErr').textContent='Ponle un título al álbum.';if(!date)return $('#alErr').textContent='Elige la fecha del evento.';const d={title,date,place:$('#alPlace').value.trim(),desc:$('#alDesc').value.trim(),tid:$('#alTid').value||null};
   if(id)Object.assign(S.albums.find(x=>x.id===id),d);else{const al=Object.assign({id:'al'+uid(),photos:[],cover:null},d);S.albums.push(al);ui.albumId=al.id}logA(`${id?'Editó':'Creó'} el álbum ${title}`);save();closeModal();ui.forceEnter=true;if(ui.route!=='galeria')location.hash='galeria';else render();toast(id?'Álbum actualizado.':'Álbum creado. Ahora sube las fotos.')}
});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='hjA'){ui.hjA=t.value;render()}else if(t.id==='hjB'){ui.hjB=t.value;render()}else if(t.id==='stP'){ui.statP=t.value;ui.chartAnim=true;render()}else if(t.id==='hA'){ui.h2hA=t.value;if(ui.h2hB===t.value)ui.h2hB=members().find(p=>p.id!==t.value).id;render()}else if(t.id==='hB'){ui.h2hB=t.value;if(ui.h2hA===t.value)ui.h2hA=members().find(p=>p.id!==t.value).id;render()}
 else if(t.id==='perM'){ui.per.m=t.value;render()}else if(t.id==='perQ'){ui.per.q=t.value;render()}else if(t.id==='perH'){ui.per.h=t.value;render()}else if(t.id==='perY'){ui.per.y=t.value;render()}else if(t.id==='perF'){ui.per.from=t.value;render()}else if(t.id==='perT'){ui.per.to=t.value;render()}
 else if(t.id==='arType'||t.id==='arT')arSync();else if(['arF','arH','arA'].includes(t.id))arLabels();
 else if(t.id==='amP'||t.id==='amSt'||t.id==='amT'){ui.amFilter={p:$('#amP').value,st:$('#amSt').value,t:$('#amT').value};ui.amLimit=40;render()}
 else if(['exFrom','exTo','exT'].includes(t.id)){ui.exp={from:$('#exFrom').value,to:$('#exTo').value,t:$('#exT').value};render()}
 else if(t.id==='impFile'){const f=t.files[0];t.value='';if(f)readImport(f)}
 else if(t.id==='albumFiles')uploadPhotos(t);
 else if(t.id==='myNat'){me().nationality=t.value;save();toast('Nacionalidad actualizada.')}
 else if(t.id==='myPhoto'||t.id==='rgPhoto'){try{const d=await resizePhoto(t.files[0]);if(t.id==='myPhoto'){me().photo=d;save();render();toast('Foto actualizada.')}else{regPhoto=d;$('#rgPrev').innerHTML=`<img class="av" src="${d}" alt="" style="width:56px;height:56px">`}}catch(err){toast('Elige un archivo de imagen (JPG o PNG).')}}
});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='fxMy'||id==='fxOp')updPen();if(id==='arHg'||id==='arAg')arLabels()});
document.addEventListener('keydown',e=>{const mb=$('#modalRoot').firstElementChild;if(e.key==='Escape'&&mb)closeModal();if(e.key==='Enter'&&/^(nt|et)Guest$/.test(e.target.id)){e.preventDefault();addGuest(e.target.id.slice(0,2))}if(mb&&mb.dataset.lb&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))lightbox(mb.dataset.lb,+mb.dataset.i+(e.key==='ArrowRight'?1:-1))});
function route(){const h=(location.hash||'').replace('#','');ui.route=VIEWS[h]&&h!=='landing'?h:'inicio';if(h==='admin'&&!isAdmin())ui.route='inicio';hideTip();render()}
window.addEventListener('hashchange',()=>{route();scrollTo({top:0})});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(me()&&ui.route==='stats')POST.stats(false);if(me()&&ui.route==='admin')POST.admin();placeSegs()},150)});
function bootScreen(inner){$('#app').innerHTML=`<main class="boot"><div><img src="${LOGO}" alt="Escudo de Pes Costa Rica">${inner}</div></main>`}
async function boot(){S=emptyState();
 if(!CONFIGURED)return bootScreen(`<h1 style="font-family:var(--display);font-style:italic;text-transform:uppercase;margin:0 0 8px">Falta conectar la base de datos</h1><p class="sub" style="max-width:460px;margin:0 auto">Abre el archivo <code>config.js</code> y pega la <b>Project URL</b> y la llave <b>anon / publishable</b> de Supabase. Luego vuelve a cargar esta página.</p>`);
 if(TOKEN){bootScreen('<div class="spin" role="status" aria-label="Cargando"></div>');let r=await pull(true);if(r===null){await new Promise(z=>setTimeout(z,1500));r=await pull(true)}
  if(r===null)return bootScreen(`<h1 style="font-family:var(--display);font-style:italic;text-transform:uppercase;margin:0 0 8px">Sin conexión</h1><p class="sub" style="margin:0 0 16px">No pudimos conectar con el servidor. Revisa tu internet.</p><button class="btn primary" onclick="location.reload()">Reintentar</button>`)}
 $('#app').innerHTML='';anLoad();route();
 setInterval(poll,30000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()});addEventListener('online',()=>{netFail&&flush();poll()})}
boot();
})();
