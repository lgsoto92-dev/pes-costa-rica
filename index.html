<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pes Costa Rica</title>
<meta name="description" content="La comunidad de usuarios de PES más grande del país. Ligas y torneos PES en línea y presenciales.">
<meta name="theme-color" content="#061530">
<meta property="og:title" content="Pes Costa Rica">
<meta property="og:description" content="Ligas y torneos PES en línea y presenciales. Los mejores juegan aquí.">
<meta property="og:image" content="logo.webp">
<link rel="icon" href="logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<script src="vendor/xlsx.full.min.js" defer></script>
<style>
:root{
  color-scheme: dark;
  --bg:#061530; --surface:#0B1F44; --surface-2:#10295A; --surface-3:#173570;
  --line:#1D3970; --line-strong:#2B4D8C;
  --text:#F3F6FB; --muted:#A9B8D3; --faint:#8395B8;
  --red:#E3202E; --red-hi:#FF5361; --red-soft:rgba(227,32,46,.16);
  --blue:#1D5FB8; --blue-hi:#6EA6FF; --blue-soft:rgba(46,110,210,.2);
  --gold:#F2B33D;
  --win:#3DDC97; --draw:#A9B8D3; --loss:#FF6B77; --pend:#6EA6FF;
  --win-bg:rgba(61,220,151,.14); --loss-bg:rgba(255,107,119,.15); --pend-bg:rgba(110,166,255,.16); --draw-bg:rgba(169,184,211,.16);
  --s-gf:#E5303D; --s-gc:#4B8FEA;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.in{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
@media (min-width:980px){body.in{padding-bottom:0}}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-hi)}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px}
.disp{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#atmo .g1,#atmo .g2{position:absolute;width:80vw;height:70vh;top:-34vh;border-radius:50%}
#atmo .g1{left:-30vw;background:radial-gradient(closest-side,rgba(227,32,46,.22),transparent)}
#atmo .g2{right:-30vw;background:radial-gradient(closest-side,rgba(29,95,184,.28),transparent)}
#atmo .band{position:absolute;left:-20%;right:-20%;top:38%;height:180px;transform:rotate(-18deg);background:linear-gradient(180deg,transparent 0 12%,rgba(29,95,184,.10) 12% 70%,rgba(227,32,46,.08) 70% 78%,transparent 78%)}
#atmo .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px);background-size:14px 14px;-webkit-mask-image:linear-gradient(160deg,#000 0%,transparent 45%);mask-image:linear-gradient(160deg,#000 0%,transparent 45%)}
#app{position:relative;z-index:1;min-height:100%}

.flag{height:4px;background:linear-gradient(90deg,var(--blue) 0 33%,#fff 33% 40%,var(--red) 40% 60%,#fff 60% 67%,var(--blue) 67%)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(6,21,48,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);min-width:0}
.brand img{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45))}
.brand-name{line-height:.9}
.brand-name b{display:block;font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;letter-spacing:.02em}
.brand-name span{display:block;font-family:var(--display);font-weight:700;font-style:italic;font-size:14px;color:var(--red-hi);letter-spacing:.14em;margin-top:2px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;text-decoration:none;color:var(--text);font-weight:600;font-size:14px;max-width:190px}
.me-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-desk{display:none;gap:2px;padding-bottom:8px;flex-wrap:wrap}
.nav-desk a{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.nav-desk a[aria-current="page"]{color:var(--text);background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--red)}
@media (hover:hover) and (pointer:fine){.nav-desk a:hover{color:var(--text)}}
@media (min-width:980px){.nav-desk{display:flex}.nav-mob{display:none!important}}
.nav-mob{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,24,54,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-mob a,.nav-mob button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--faint);text-decoration:none;font-size:11px;font-weight:600;min-height:48px;justify-content:center;border-radius:8px;background:none;border:0;cursor:pointer}
.nav-mob [aria-current="page"]{color:var(--red-hi)}
.demo-bar{background:rgba(29,95,184,.18);border-bottom:1px solid rgba(110,166,255,.25);font-size:13px;color:#CFE0FF}
.demo-bar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:6px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--blue-hi);text-decoration:underline;cursor:pointer;padding:4px;font-weight:600;font-size:13px}
@media (max-width:480px){.hide-xs{display:none}}

main{padding-block:22px 30px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(30px,5vw,44px);line-height:1;letter-spacing:.01em}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:66ch}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-hi);font-weight:700;margin-bottom:4px}
.eyebrow::before{content:"";display:inline-block;width:18px;height:3px;background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%);vertical-align:middle;margin-right:8px;border-radius:2px;transform:skewX(-20deg)}
.stack{display:flex;flex-direction:column;gap:18px}
.grid-2{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.grid-2 > *{min-width:0}
@media (min-width:900px){.grid-2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.grid-2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.panel h2 svg{color:var(--red-hi);flex:none}
.panel h2 .count{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.sub{color:var(--muted);font-size:13.5px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--blue-soft);border:1px solid rgba(110,166,255,.25);font-size:13.5px;color:#D6E4FF;margin-bottom:16px}
.note svg{flex:none;margin-top:2px;color:var(--blue-hi)}
.bonus-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* periodo */
.perbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(11,31,68,.7)}
.perbar .flabel{margin-right:2px}
.perbar select,.perbar input{min-height:38px;width:auto;padding:6px 10px;font-size:14px}
.perbar .lbl{margin-left:auto;font-size:13px;color:var(--muted)}
.perbar .lbl b{color:var(--text)}

.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
@media (min-width:720px){.strip{grid-template-columns:repeat(4,1fr)}}
.strip > div{background:var(--surface);padding:12px 16px;min-width:0}
.strip .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.strip .v{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.strip .v small{font-family:var(--body);font-style:normal;font-size:12.5px;color:var(--muted);font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tscroll{overflow-x:auto;margin-inline:-18px;padding-inline:18px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
.t th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t th.l,.t td.l{text-align:left}
.t td.pts{font-family:var(--display);font-weight:800;font-style:italic;font-size:20px;color:var(--text)}
.t td.tg{color:var(--gold);font-weight:700}
.t td.bn{color:var(--blue-hi)}
.t tr.me td{background:rgba(227,32,46,.08)}
.pos{color:var(--muted);width:34px;font-weight:600}
.md{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--medal) 18%,transparent);color:var(--medal);font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--medal) 50%,transparent)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:600}
.who-btn{background:none;border:0;padding:0;cursor:pointer;text-align:left}
@media (hover:hover) and (pointer:fine){.who-btn:hover b{color:var(--red-hi)}}
.hide-sm{display:none}
@media (min-width:640px){.hide-sm{display:table-cell}}
.av{border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;color:#061530;overflow:hidden;background:var(--surface-3)}
.form{display:inline-flex;gap:3px}
.r{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;line-height:1}
.r.G{background:var(--win-bg);color:var(--win)}.r.E{background:var(--draw-bg);color:var(--draw)}.r.P{background:var(--loss-bg);color:var(--loss)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.ok{background:var(--win-bg);color:var(--win)}
.pill.pend{background:var(--pend-bg);color:var(--pend)}
.pill.rej{background:var(--loss-bg);color:var(--loss)}
.pill.red{background:var(--red-soft);color:var(--red-hi)}
.pill.blue{background:var(--blue-soft);color:var(--blue-hi)}
.pill.gold{background:rgba(242,179,61,.15);color:var(--gold)}
.pill.mute{background:var(--draw-bg);color:var(--muted)}
.progress{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;width:100%;min-width:80px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red));border-radius:99px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,box-shadow 160ms ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--loss);border-color:rgba(255,107,119,.4);background:transparent}
.btn.okb{color:var(--win);border-color:rgba(61,220,151,.4);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.lg{min-height:48px;padding:0 22px;font-size:15.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
@media (hover:hover) and (pointer:fine){.btn:not([disabled]):hover{border-color:var(--blue-hi)}.btn.primary:not([disabled]):hover{background:#F0303E;box-shadow:0 6px 20px rgba(227,32,46,.35)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.fgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:560px){.fgrid.two{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.field .hint{font-size:12.5px;color:var(--faint)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);font-size:15px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-hi);box-shadow:0 0 0 3px rgba(110,166,255,.2)}
.err{color:var(--loss);font-size:13.5px;font-weight:600;min-height:1em}
.score-in{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.score-in input{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;text-align:center;min-height:58px;padding:6px 4px;-moz-appearance:textfield}
.score-in input::-webkit-inner-spin-button,.score-in input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.score-in .dash{font-family:var(--display);font-size:28px;color:var(--faint);padding-bottom:12px}
.score-in label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:stretch}
.stepper .st{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:9px;font-size:22px;font-weight:700;cursor:pointer;color:var(--text);transition:transform 140ms var(--ease-out),border-color 160ms ease}
.stepper .st:active{transform:scale(.93)}
.score-in input.bump{animation:bump 220ms var(--ease-out)}
.seg{position:relative;display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{position:relative;z-index:1;border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;transition:color 160ms ease}
.seg button[aria-pressed="true"]{color:var(--text)}
.seg .badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px}
.seg-ind{position:absolute;top:0;left:0;border-radius:7px;background:var(--surface-3);box-shadow:inset 0 -2px 0 var(--red);z-index:0;pointer-events:none}
.seg-ind.anim{transition:transform 280ms var(--ease-out),width 280ms var(--ease-out),height 280ms var(--ease-out)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:220px;overflow:auto;padding:2px}
.checks label{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;cursor:pointer;min-width:0}
.checks label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checks input{accent-color:var(--red);width:16px;height:16px;flex:none}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio-cards label{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);cursor:pointer;font-size:13px;color:var(--muted)}
.radio-cards label b{display:block;color:var(--text);font-size:14px}
.radio-cards input{accent-color:var(--red);margin-top:3px}
.radio-cards label:has(input:checked){border-color:var(--red);background:var(--red-soft)}
.guest-list{display:flex;flex-wrap:wrap;gap:6px}
.guest-list .pill{padding:4px 6px 4px 10px}
.guest-list button{background:none;border:0;color:inherit;cursor:pointer;display:grid;place-items:center;width:22px;height:22px;border-radius:50%}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick input,.file-hide{position:absolute;opacity:0;width:1px;height:1px}

.mlist{display:flex;flex-direction:column}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.m .side{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:14px}
.m .side > span:not(.av){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .side.r2{justify-content:flex-end;text-align:right}
.m .sc{font-family:var(--display);font-weight:800;font-style:italic;font-size:22px;text-align:center;min-width:64px;font-variant-numeric:tabular-nums}
.m .sc small{display:block;font-family:var(--body);font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.m .win{color:var(--text)} .m .lose{color:var(--muted)}
.m-meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:-2px}
.m-meta .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.m.del{opacity:.55}

.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;transition:transform 180ms var(--ease-out),border-color 160ms ease;position:relative;overflow:hidden;color:var(--text)}
.tcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--blue))}
.tcard.ext::before{background:var(--line-strong)}
.tcard:active{transform:scale(.98)}
.tcard h3{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:22px;line-height:1.05}
.tcard .champ{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.tcard .champ b{color:var(--gold)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;transition:transform 180ms var(--ease-out),border-color 160ms ease;color:var(--text)}
.pcard:active{transform:scale(.98)}
.pcard .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .meta{font-size:12.5px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){
  .tcard:hover,.pcard:hover{transform:translateY(-2px);border-color:var(--line-strong)}
  .t tbody tr td{transition:background-color 120ms ease}
  .t tbody tr:hover td{background:rgba(255,255,255,.03)}
}

.bracket{display:flex;gap:22px;overflow-x:auto;padding-bottom:8px}
.round{display:flex;flex-direction:column;gap:12px;min-width:210px;flex:1}
.round h4{margin:0 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--red-hi);font-weight:700}
.round .col{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:12px}
.bm{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bm .ln{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13.5px}
.bm .ln + .ln{border-top:1px solid var(--line)}
.bm .ln > span:not(.av){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .ln b{font-family:var(--display);font-weight:800;font-style:italic;font-size:17px;font-variant-numeric:tabular-nums}
.bm .ln.w span{color:var(--text);font-weight:700}.bm .ln.w b{color:var(--red-hi)}
.bm .ln.l{color:var(--muted)}
.bm .ln.tbd{color:var(--faint);font-style:italic}
.bm .pen{font-size:11px;color:var(--muted);padding:0 10px 6px}

.champ-banner{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:14px;background:linear-gradient(115deg,rgba(227,32,46,.28),rgba(29,95,184,.28));border:1px solid rgba(255,255,255,.14);flex-wrap:wrap;position:relative;overflow:hidden;margin-bottom:18px}
.champ-banner .av{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--red)}
.champ-banner .t1{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.champ-banner .t2{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;line-height:1}
.champ-banner .btn{margin-left:auto}
.champ-banner::after{content:"";position:absolute;top:0;bottom:0;left:0;width:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:translateX(-140%) skewX(-20deg);animation:sheen 1500ms 450ms var(--ease-in-out) both;pointer-events:none}

.h2h-head{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.h2h-p{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.h2h-p b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.h2h-score{font-family:var(--display);font-weight:800;font-style:italic;font-size:clamp(38px,8vw,60px);line-height:1;font-variant-numeric:tabular-nums}
.h2h-score small{display:block;font-family:var(--body);font-style:normal;font-weight:600;font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin-top:16px}
.split i{display:block;height:100%}
.split-legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv > div{background:var(--surface-2);border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.kv .k{font-size:12px;color:var(--muted);font-weight:600}
.kv .v{font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.kv .v .sub{font-family:var(--body);font-style:normal;font-weight:500}
.rec-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rec-list li{display:flex;align-items:center;gap:10px;font-size:14px}
.rec-list .big{font-family:var(--display);font-weight:800;font-style:italic;font-size:22px;color:var(--red-hi);min-width:56px;font-variant-numeric:tabular-nums}
.rec-list .det{color:var(--muted);font-size:12.5px}

.chart{position:relative;width:100%}
.chart svg{display:block;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.sq{height:10px;width:10px;border-radius:3px}
#tip{position:fixed;z-index:80;pointer-events:none;background:#04102A;border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:240px;opacity:0;transition:opacity 120ms ease}
#tip.on{opacity:1}

.modal-back{position:fixed;inset:0;z-index:60;background:rgba(2,8,22,.78);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity 180ms ease}
.modal-back.open{opacity:1}
.modal-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;width:100%;max-width:540px;max-height:calc(100dvh - 32px);overflow:auto;padding:20px;transform:scale(.96);transition:transform 220ms var(--ease-out)}
.modal-back.open .modal-card{transform:scale(1)}
.modal-card.wide{max-width:760px}
.modal-card.xl{max-width:1000px;padding:14px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-head h2{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:26px;line-height:1}
.modal-head .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);width:40px;height:40px;border-radius:8px;display:grid;place-items:center}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.champ-img{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,20px);opacity:0;background:#F4F7FC;color:#061530;font-weight:600;padding:11px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:14px;transition:transform 260ms var(--ease-out),opacity 200ms ease;pointer-events:none;max-width:calc(100% - 32px);border-left:4px solid var(--red)}
#toast.on{transform:translate(-50%,0);opacity:1}
@media (min-width:980px){#toast{bottom:28px}}
.admin-q{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:opacity 200ms ease,transform 220ms var(--ease-out)}
.admin-q.leaving{opacity:0;transform:translateX(32px)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;gap:10px}
.log li time{color:var(--faint);white-space:nowrap;font-size:12.5px}
.sheet-links{display:flex;flex-direction:column;gap:6px}
.sheet-links a,.sheet-links button{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;cursor:pointer;text-align:left;font-size:15px}

/* bienvenida */
.landing{min-height:100vh;display:grid;place-items:center;padding-block:40px;text-align:center;position:relative}
.landing-in{max-width:640px;display:flex;flex-direction:column;align-items:center;gap:18px}
.landing img.logo{width:min(250px,62vw);height:auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
.landing h1{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(46px,10vw,84px);line-height:.9;letter-spacing:.01em}
.landing h1 span{color:var(--red-hi);display:block;white-space:nowrap}
.landing .lead{font-size:clamp(17px,2.6vw,20px);color:#DCE6F7;margin:0;max-width:52ch}
.landing .tag{font-size:14.5px;color:var(--muted);margin:0;max-width:52ch}
.landing .cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.enter-l > *{animation:rise 520ms var(--ease-out) both}
.enter-l > *:nth-child(2){animation-delay:80ms}.enter-l > *:nth-child(3){animation-delay:140ms}.enter-l > *:nth-child(4){animation-delay:200ms}.enter-l > *:nth-child(5){animation-delay:260ms}.enter-l > *:nth-child(6){animation-delay:320ms}
.enter-l img.logo{animation:pop 700ms var(--ease-out) both}
.social{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.social a{display:inline-flex;max-width:100%;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(16,41,90,.7);color:var(--text);text-decoration:none;font-weight:600;font-size:14px}
.social a.wa{border-color:rgba(61,220,151,.45)}
.social a.wa svg{color:var(--win)}
.social a.fb svg{color:var(--blue-hi)}
@media (hover:hover) and (pointer:fine){.social a:hover{border-color:var(--blue-hi)}}
footer.foot{border-top:1px solid var(--line);margin-top:10px;padding-block:22px;background:rgba(6,21,48,.6)}
footer.foot .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
footer.foot .fb-row{display:flex;align-items:center;gap:12px}
footer.foot img{width:40px;height:40px}
footer.foot .social{justify-content:flex-start}

/* carrusel */
.car{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px;background:var(--surface)}
.car-track{display:flex;transition:transform 560ms var(--ease-in-out)}
.slide{flex:0 0 100%;min-width:0;padding:26px 24px 56px;min-height:330px;position:relative;background:linear-gradient(115deg,transparent 0 46%,rgba(29,95,184,.26) 46% 70%,rgba(227,32,46,.2) 70% 75%,transparent 75%),radial-gradient(80% 120% at 0% 0%,rgba(227,32,46,.2),transparent 60%),var(--surface)}
.slide::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px);background-size:12px 12px;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,#000,transparent 60%);mask-image:linear-gradient(90deg,#000,transparent 60%)}
.slide > *{position:relative;z-index:1}
.slide .kick{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--red-hi);font-weight:700}
.slide h2{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(32px,6vw,52px);line-height:.95;margin:4px 0 16px}
.top5{display:grid;gap:8px;list-style:none;margin:0;padding:0;max-width:640px}
.top5 li{display:grid;grid-template-columns:34px 40px 1fr auto auto;gap:10px;align-items:center;background:rgba(6,21,48,.55);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.top5 .n{font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;color:var(--muted);text-align:center}
.top5 li:first-child .n{color:var(--gold)}
.top5 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top5 .p{font-family:var(--display);font-weight:800;font-style:italic;font-size:22px}
.champs3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.champs3 > div{display:flex;gap:12px;align-items:center;background:rgba(6,21,48,.55);border:1px solid var(--line);border-radius:12px;padding:12px}
.champs3 .av{box-shadow:0 0 0 3px var(--gold)}
.champs3 b{display:block;font-size:16px}
.big-ann{display:grid;gap:14px;max-width:680px}
.big-ann .meta{display:flex;flex-wrap:wrap;gap:8px}
.car-ctrl{position:absolute;left:0;right:0;bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:2}
.car-dots{display:flex;gap:6px}
.car-dots button{width:28px;height:28px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.car-dots button i{display:block;width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.35);transition:width 260ms var(--ease-out),background-color 200ms ease}
.car-dots button[aria-current="true"] i{width:22px;background:var(--red)}
.car-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(6,21,48,.75);color:var(--text);cursor:pointer;display:grid;place-items:center}
.car-prog{position:absolute;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--red),var(--blue));width:100%;transform-origin:left;transform:scaleX(0);z-index:3}
.car-prog.run{animation:carp var(--dur) linear forwards}
@keyframes carp{to{transform:scaleX(1)}}
.slide .figure{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.slide .figure .av{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--red)}
.slide .gal-cover{width:100%;max-width:560px;aspect-ratio:16/9;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--surface-2)}

/* anuncios */
.ann{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.ann::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--red),var(--blue))}
.ann h3{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:24px;line-height:1}
.ann .when{display:flex;gap:8px;flex-wrap:wrap}
.ann .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.datebox{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:66px;border-radius:10px;background:var(--red);color:#fff;flex:none;line-height:1}
.datebox b{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px}
.datebox span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* galería */
.albums{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.album{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--text);transition:transform 180ms var(--ease-out),border-color 160ms ease}
.album:active{transform:scale(.98)}
.album .cov{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;background:var(--surface-2)}
.album .inf{padding:12px 14px}
.album .inf b{display:block;font-size:15.5px}
@media (hover:hover) and (pointer:fine){.album:hover{transform:translateY(-2px);border-color:var(--line-strong)}}
.photos{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.photos button{padding:0;border:0;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--surface-2);aspect-ratio:1;position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 260ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){.photos button:hover img{transform:scale(1.04)}}
.photos .cv{position:absolute;left:6px;top:6px}
.lb{display:flex;flex-direction:column;gap:10px}
.lb-stage{position:relative;background:#020816;border-radius:12px;display:grid;place-items:center;min-height:50vh}
.lb-stage img{max-width:100%;max-height:70vh;display:block;border-radius:6px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(6,21,48,.8);color:#fff;cursor:pointer;display:grid;place-items:center}
.lb-nav.prev{left:10px}.lb-nav.next{right:10px}
.upl{border:2px dashed var(--line-strong);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}

/* importación */
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.diff > div{border-radius:10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line)}
.diff b{display:block;font-family:var(--display);font-weight:800;font-style:italic;font-size:28px;line-height:1}
.errlist{max-height:220px;overflow:auto;font-size:13px;border:1px solid var(--line);border-radius:10px}
.errlist div{padding:6px 10px;border-bottom:1px solid var(--line)}
.errlist div:last-child{border-bottom:0}

/* podio */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin-bottom:18px;padding:34px 16px 0;border-radius:18px;border:1px solid var(--line);background:linear-gradient(115deg,transparent 0 30%,rgba(29,95,184,.22) 30% 58%,rgba(227,32,46,.18) 58% 64%,transparent 64%),radial-gradient(60% 90% at 50% 100%,rgba(227,32,46,.18),transparent 70%),var(--surface);overflow:hidden;position:relative}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;cursor:pointer;background:none;border:0;padding:0;color:var(--text);position:relative;z-index:1}
.pod.p1{--medal:#F2B33D}.pod.p2{--medal:#D5DDEA}.pod.p3{--medal:#D9905A}
.pod .ph{position:relative;transition:transform 200ms var(--ease-out)}
.pod .ph .av{box-shadow:0 0 0 3px var(--medal),0 12px 30px rgba(0,0,0,.5)}
.pod .crown{position:absolute;top:-26px;left:50%;transform:translateX(-50%) rotate(-8deg);color:var(--gold);line-height:0}
.pod .crown svg{fill:rgba(242,179,61,.35)}
.pod b{font-size:14.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sub{font-size:12px}
.pod .ppts{font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;line-height:1;color:var(--medal);font-variant-numeric:tabular-nums}
.pod .block{width:100%;margin-top:6px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--medal) 32%,transparent),color-mix(in srgb,var(--medal) 5%,transparent));border:1px solid color-mix(in srgb,var(--medal) 50%,transparent);border-bottom:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-style:italic;font-size:44px;color:var(--medal);transform-origin:50% 100%}
.pod.p1 .block{height:128px;font-size:56px}.pod.p2 .block{height:94px}.pod.p3 .block{height:72px}
@media (hover:hover) and (pointer:fine){.pod:hover .ph{transform:translateY(-4px)}}
@media (max-width:480px){.pod .sub{display:none}.pod.p1 .block{height:104px}.pod.p2 .block{height:78px}.pod.p3 .block{height:60px}.slide{padding:22px 16px 56px}.top5 li{grid-template-columns:28px 34px 1fr auto}.top5 .tt{display:none}}

.ticker{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px;overflow:hidden}
.ticker .lbl{flex:none;display:flex;align-items:center;gap:7px;padding:0 22px 0 12px;background:var(--red);color:#fff;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.ticker .lbl i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.6s ease infinite}
.ticker .vp{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.ticker .track{display:flex;width:max-content;animation:tick 80s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker .it{display:flex;gap:8px;align-items:center;font-size:13.5px;white-space:nowrap;height:42px;padding:0 18px;border-right:1px solid var(--line);font-weight:600}
.ticker .it b{font-family:var(--display);font-weight:800;font-style:italic;color:var(--red-hi);font-size:18px;font-variant-numeric:tabular-nums}
.ticker .it .d{color:var(--faint);font-weight:500;font-size:12px}

@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes grow{from{opacity:0;transform:scaleY(.35)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes barUp{from{transform:scaleY(0)}}
@keyframes sheen{from{transform:translateX(-140%) skewX(-20deg)}to{transform:translateX(420%) skewX(-20deg)}}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes bump{50%{transform:scale(1.07)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes blink{50%{opacity:.3}}
.enter > *{animation:rise 380ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 55ms)}
.enter .stagger > *{animation:rise 340ms var(--ease-out) both;animation-delay:calc(140ms + var(--r,0) * 32ms)}
.enter .pod .block{animation:grow 620ms var(--ease-out) both}
.enter .pod > :not(.block){animation:pop 460ms var(--ease-out) both}
.enter .pod.p3 .block{animation-delay:120ms}.enter .pod.p2 .block{animation-delay:220ms}.enter .pod.p1 .block{animation-delay:340ms}
.enter .pod.p3 > :not(.block){animation-delay:300ms}.enter .pod.p2 > :not(.block){animation-delay:400ms}.enter .pod.p1 > :not(.block){animation-delay:540ms}
.enter .split i{animation:growX 700ms var(--ease-out) both;transform-origin:left center}
.enter .progress i{animation:growX 700ms 200ms var(--ease-out) both;transform-origin:left center}
.chart svg .late{animation:fadeIn 300ms 820ms ease both}
.chart svg.anim .bar{transform-box:fill-box;transform-origin:50% 100%;animation:barUp 520ms var(--ease-out) both;animation-delay:calc(var(--b) * 45ms)}
.slide.on .top5 li,.slide.on .champs3 > div{animation:rise 420ms var(--ease-out) both}
.slide.on .top5 li:nth-child(2){animation-delay:60ms}.slide.on .top5 li:nth-child(3){animation-delay:120ms}.slide.on .top5 li:nth-child(4){animation-delay:180ms}.slide.on .top5 li:nth-child(5){animation-delay:240ms}
#confetti{position:fixed;inset:0;z-index:95;pointer-events:none}
.rot{position:relative;display:block;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--surface-2);border:0;padding:0;cursor:pointer}
.rot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 700ms ease}
.rot img.on{opacity:1}
.rot-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(transparent,rgba(3,12,34,.9));text-align:left;color:var(--text);font-size:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .br{display:grid;grid-template-columns:110px minmax(0,1fr) 48px;gap:4px 10px;align-items:center}
.bars .br .nm{font-weight:600;font-size:14px}
.bars .br .tr{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bars .br .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red));border-radius:99px}
.bars .br .vl{text-align:right;font-weight:700}
.bars .br .sub{grid-column:2/4;font-size:12px}
.enter .bars .tr i{animation:growX 700ms var(--ease-out) both;transform-origin:left center}
.hours{display:flex;align-items:flex-end;gap:3px;height:120px}
.hours i{flex:1;background:var(--s-gc);border-radius:3px 3px 0 0;min-width:0}
.hours i.pk{background:var(--red)}
.slide.promo{padding:0 0 56px;min-height:0;background:#030C22}
.slide.promo::after{display:none}
.slide.promo{display:flex;flex-direction:column;justify-content:center}
@media (max-width:640px){.slide.promo .promo-actions{position:static;justify-content:center;margin:14px 12px 0}}
.promo-img{width:100%;aspect-ratio:16/9;display:block;object-fit:cover;background:var(--surface-2)}
.promo-actions{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:2;flex-wrap:wrap;justify-content:flex-end}
.prize{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:rgba(242,179,61,.1);border:1px solid rgba(242,179,61,.4);font-size:14.5px}
.prize svg{color:var(--gold);flex:none}
.rules{white-space:pre-wrap;margin:0;font-size:14.5px;line-height:1.65;color:#DCE6F7}
.tb-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;cursor:pointer;padding:10px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2)}
.chk input{accent-color:var(--red);width:18px;height:18px}
.hj-title{color:var(--text);text-shadow:4px 4px 0 var(--red)}
.hj-big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hj-big > div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.hj-big b{display:block;font-family:var(--display);font-weight:800;font-style:italic;font-size:clamp(28px,5vw,40px);line-height:1}
.fam{display:flex;flex-direction:column;gap:8px}
.fam .it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.fam .it b{display:block}
.fam .it .dif{margin-left:auto;font-family:var(--display);font-weight:800;font-style:italic;font-size:24px}
.fam .it.son{border-color:rgba(255,107,119,.35)} .fam .it.son .dif{color:var(--loss)}
.fam .it.dad{border-color:rgba(61,220,151,.35)} .fam .it.dad .dif{color:var(--win)}
.verdict{border-radius:16px;padding:22px 18px;text-align:center;background:linear-gradient(115deg,rgba(227,32,46,.22),rgba(29,95,184,.26));border:1px solid rgba(255,255,255,.14)}
.verdict .lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.verdict h3{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:clamp(28px,6vw,50px);line-height:.95;margin:8px 0 10px}
.verdict h3 em{color:var(--red-hi);font-style:inherit}
.dna{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:14px auto 6px;max-width:360px}
.dna i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--red))}
.enter .dna i{animation:growX 900ms 200ms var(--ease-out) both;transform-origin:left center}
.cap{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:13px;letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:var(--red);color:#fff;white-space:nowrap}
.cap.b{background:var(--blue)}
.cap.m{background:var(--surface-3);color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0ms!important;animation:none!important}
  .ticker .vp{overflow-x:auto}
}
.boot{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
.boot img{width:120px;height:120px;margin:0 auto 18px;display:block}
.boot .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--red);margin:18px auto 0;animation:spin 800ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.boot .spin{animation-duration:2400ms}}
.boot code{background:var(--surface-2);padding:2px 6px;border-radius:6px}

const ICONS={
 flame:'<path d="M12 22c4.4 0 7-3 7-6.8 0-3.4-2.2-5.7-3.9-7.7-.4 2-1.6 3.3-2.9 3.3.4-3.2-.8-6.3-3.6-8.8-.4 3.8-4.6 6.4-4.6 11.3C4 19 7.6 22 12 22z"/>',

 download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', upload:'<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 logout:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>', camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', crown:'<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', image:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6M15.5 9.5h.01"/>',
 megaphone:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 8a5 5 0 0 1 0 8M18 5a9 9 0 0 1 0 14"/>',
 pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/>', globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>', left:'<path d="M15 5l-7 7 7 7"/>', right:'<path d="M9 5l7 7-7 7"/>', pause:'<path d="M8 5v14M16 5v14"/>', play:'<path d="M7 5l12 7-12 7z"/>',
 history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/>', restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>', star:'<path d="M12 3l2.8 5.9 6.2.8-4.6 4.3 1.2 6.2L12 17.2 6.4 20.2l1.2-6.2L3 9.7l6.2-.8z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>', file:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M8 13h8M8 17h8"/>'
};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
const socialHTML=()=>`<div class="social"><a class="fb" href="${FB}" target="_blank" rel="noopener">${ic('users')}Síguenos en Facebook</a><a class="wa" href="${WA}" target="_blank" rel="noopener">${ic('chat')}Grupo de WhatsApp</a></div>`;

/* ---------- conexión con Supabase ---------- */
const CFG=window.PESCR_CONFIG||{};const API=String(CFG.url||'').trim().replace(/\/+$/,'');const KEY=String(CFG.key||'').trim();
const CONFIGURED=/^https:\/\/[^/]+/.test(API)&&KEY.length>20&&!/PEGA/i.test(API+KEY);
const TK='pescr-token';let TOKEN=null;try{TOKEN=localStorage.getItem(TK)}catch(e){}
function setToken(t){TOKEN=t;try{t?localStorage.setItem(TK,t):localStorage.removeItem(TK)}catch(e){}}
function hdrs(extra){const h=Object.assign({apikey:KEY},extra);if(/^eyJ/.test(KEY))h.Authorization='Bearer '+KEY;return h}
async function api(fn,body,opt={}){const r=await fetch(`${API}/rest/v1/rpc/${fn}`,{method:'POST',headers:hdrs({'Content-Type':'application/json'}),body:JSON.stringify({body}),keepalive:!!opt.keepalive});
 if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error(m||('HTTP '+r.status))}return r.json()}

/* ---------- fotos (Supabase Storage) ---------- */
async function phURL(k){return k?`${API}/storage/v1/object/public/fotos/${k.split('/').map(encodeURIComponent).join('/')}`:null}
async function phGet(k){try{const r=await fetch(await phURL(k));return r.ok?await r.blob():null}catch(e){return null}}
function phDel(){/* el archivo queda guardado; solo se quita del álbum */}
async function phUpload(name,blob){const r=await fetch(`${API}/storage/v1/object/fotos/${name}`,{method:'POST',headers:hdrs({'Content-Type':'image/jpeg','cache-control':'max-age=31536000'}),body:blob});if(!r.ok)throw new Error('upload '+r.status)}
function hydratePhotos(root=document){root.querySelectorAll('img[data-ph]').forEach(async im=>{const u=await phURL(im.dataset.ph);if(u)im.src=u})}
function resizeTo(file,max,q){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error('tipo'));const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('x')),'image/jpeg',q)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}

/* ---------- estado ---------- */
let S=null;
const ui={route:'inicio',rankTab:'comunidad',statsTab:'jugador',statP:null,h2hA:null,h2hB:null,tId:null,tTab:null,adminTab:'pendientes',amFilter:{p:'',st:'',t:''},amLimit:40,exp:{from:'',to:'',t:''},albumId:null,per:{t:'todo'}};
const COLLS=['players','matches','tournaments','history','announcements','albums'];
const DEF_SET={bonus:{grupos:7,ko:5,liga:10,suizo:5},minFriendly:20,hjDiff:3,hjMin:4};
function emptyState(){return {players:[],matches:[],tournaments:[],history:[],announcements:[],albums:[],log:[],me:null,settings:JSON.parse(JSON.stringify(DEF_SET))}}
let BASE=null,REV=null,LOGQ=[],syncing=null,dirtyT=null,netFail=false;
const clean=(c,o)=>{if(c==='players'){const {pass,...r}=o;return r}return o};
function baseline(){BASE={};COLLS.forEach(c=>{const m=BASE[c]=new Map();S[c].forEach(o=>m.set(o.id,JSON.stringify(clean(c,o))))});BASE.settings=JSON.stringify(S.settings)}
function applyServer(r){const d=r.data||{};const s=emptyState();COLLS.forEach(c=>{s[c]=Array.isArray(d[c])?d[c]:[]});const st=(d.settings||[])[0];
 if(st){const {id,...rest}=st;Object.assign(s.settings,rest);s.settings.bonus=Object.assign({},DEF_SET.bonus,rest.bonus||{})}
 s.me=r.me;s.log=r.log||[];S=s;REV=r.rev;baseline()}
function diff(){const ch=[];if(!BASE||!S.me)return ch;COLLS.forEach(c=>{const m=BASE[c],seen=new Set();S[c].forEach(o=>{if(!o||!o.id)return;seen.add(o.id);const d=clean(c,o),j=JSON.stringify(d);if(m.get(o.id)!==j)ch.push({c,id:o.id,d,j})});m.forEach((_,id)=>{if(!seen.has(id))ch.push({c,id,d:null})})});
 const sj=JSON.stringify(S.settings);if(sj!==BASE.settings)ch.push({c:'settings',id:'settings',d:Object.assign({id:'settings'},S.settings),j:sj});return ch}
function save(){clearTimeout(dirtyT);dirtyT=setTimeout(flush,30)}
async function flush(){if(syncing){await syncing;return flush()}if(!TOKEN)return;const ch=diff();const logs=LOGQ.splice(0);if(!ch.length&&!logs.length)return;
 syncing=(async()=>{try{const r=await api('pescr_push',{token:TOKEN,changes:ch.map(({c,id,d})=>({c,id,d})),logs});
   if(r.error==='session'){sessionLost();return}
   ch.forEach(x=>{if(x.c==='settings')BASE.settings=x.j;else if(x.d===null)BASE[x.c].delete(x.id);else BASE[x.c].set(x.id,x.j)});
   if(netFail){netFail=false;toast('Conexión recuperada: tus cambios quedaron guardados.')}
   if(r.rejected){toast('Algunos cambios no se guardaron porque no tienes permiso.');await pull(true);render()}}
  catch(e){LOGQ.unshift(...logs);if(!netFail)toast('Sin conexión: el cambio todavía no se guardó. Se reintenta solo.');netFail=true}})();
 try{await syncing}finally{syncing=null}}
async function pull(force){if(!TOKEN)return false;try{const r=await api('pescr_pull',{token:TOKEN,rev:force?null:REV});if(r.error==='session'){sessionLost();return false}if(r.same)return 'same';applyServer(r);return true}catch(e){return null}}
function sessionLost(){setToken(null);S=emptyState();BASE=null;REV=null;closeModal();ui.forceEnter=true;if(location.hash)location.hash='';render();toast('Tu sesión terminó. Vuelve a entrar.')}
async function poll(){if(!TOKEN||document.visibilityState==='hidden'||syncing)return;if(diff().length||LOGQ.length)return flush();
 if($('#modalRoot').firstElementChild)return;const ae=document.activeElement;if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))return;
 const r=await pull(false);if(r===true){ui.forceEnter=false;const y=scrollY;render();scrollTo(0,y)}}
const P=id=>S.players.find(p=>p.id===id);
const me=()=>S.me?P(S.me):null;
const isAdmin=()=>{const m=me();return !!(m&&m.role==='admin')};
const members=()=>S.players.filter(p=>p.active!==false&&!p.guest);
const isGuest=id=>{const p=P(id);return !!(p&&p.guest)};
const tOf=m=>m.tid?S.tournaments.find(t=>t.id===m.tid):null;
function kindOf(m){if(m.tid){const t=tOf(m);if(t)return t.official===false?'externo':'oficial'}if(m.tname)return m.tofficial===false?'externo':'oficial';return 'amistoso'}
const tName=m=>{const t=tOf(m);return t?t.name:(m.tname||'')};
const KIND={amistoso:'Amistoso',oficial:'Torneo válido',externo:'Torneo externo'};
const approvedSorted=()=>S.matches.filter(m=>m.status==='aprobado').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
function logA(txt){S.log.unshift({ts:Date.now(),by:S.me||'sistema',txt});S.log=S.log.slice(0,300);LOGQ.push(txt)}
let lastTs=0;const nextTs=()=>(lastTs=Math.max(Date.now(),lastTs+1));
function snap(m){return {home:m.home,away:m.away,hg:m.hg,ag:m.ag,pen:m.pen,date:m.date,status:m.status,note:m.note,tname:m.tname,tofficial:m.tofficial}}
function revise(m,changes,why){(m.hist=m.hist||[]).push({at:Date.now(),by:S.me||'sistema',why,before:snap(m)});Object.assign(m,changes)}

/* ---------- periodo ---------- */
function yearsInData(){const ys=new Set([new Date().getFullYear()]);S.matches.forEach(m=>ys.add(+m.date.slice(0,4)));return [...ys].sort((a,b)=>b-a)}
function perRange(){const p=ui.per,y=+(p.y||new Date().getFullYear());switch(p.t){
 case 'mes':{const [yy,mm]=(p.m||todayStr().slice(0,7)).split('-');return {from:`${yy}-${mm}-01`,to:`${yy}-${mm}-31`,label:`${MESL[+mm-1]} ${yy}`}}
 case 'trimestre':{const q=+(p.q||Math.ceil((new Date().getMonth()+1)/3));return {from:`${y}-${pad((q-1)*3+1)}-01`,to:`${y}-${pad(q*3)}-31`,label:`Trimestre ${q} de ${y}`}}
 case 'semestre':{const h=+(p.h||(new Date().getMonth()<6?1:2));return {from:`${y}-${h===1?'01':'07'}-01`,to:`${y}-${h===1?'06':'12'}-31`,label:`${h===1?'Primer':'Segundo'} semestre de ${y}`}}
 case 'anio':return {from:`${y}-01-01`,to:`${y}-12-31`,label:`Año ${y}`};
 case 'rango':return {from:p.from||'',to:p.to||'',label:p.from||p.to?`${p.from?fmtD(p.from):'inicio'} a ${p.to?fmtD(p.to):'hoy'}`:'Todas las fechas'};
 default:return null}}
const inR=(d,r)=>!r||((!r.from||d>=r.from)&&(!r.to||d<=r.to));
function periodBar(){const p=ui.per;const ys=yearsInData();const r=perRange();const types=[['todo','Todo'],['mes','Mes'],['trimestre','Trimestre'],['semestre','Semestre'],['anio','Año'],['rango','Rango']];
 const months=[];ys.forEach(y=>{for(let m=12;m>=1;m--){const k=`${y}-${pad(m)}`;if(k<=todayStr().slice(0,7))months.push(k)}});

function rr(list,legs){let L=list.slice();if(L.length%2)L.push(null);const n=L.length,out=[];for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const a=L[i],b=L[n-1-i];if(a&&b)out.push({round:r,h:r%2?b:a,a:r%2?a:b})}L=[L[0],L[n-1],...L.slice(1,n-1)]}if(legs===2){const n1=n-1;out.slice().forEach(x=>out.push({round:x.round+n1,h:x.a,a:x.h}))}return out}

 for(let i=0;i<pairs.length;i++){const [a,b]=pairs[i];const ga=q.find(x=>x.id===a),gb=q.find(x=>x.id===b);if(ga&&gb&&ga.g===gb.g){for(let j=i+1;j<pairs.length;j++){const c=q.find(x=>x.id===pairs[j][1]);if(c&&c.g!==ga.g&&q.find(x=>x.id===pairs[j][0]).g!==gb.g){const t=pairs[i][1];pairs[i][1]=pairs[j][1];pairs[j][1]=t;break}}}}

function computeT(t){
 const ms=S.matches.filter(m=>m.tid===t.id&&m.status==='aprobado').sort((a,b)=>a.ts-b.ts);const byKey={};ms.forEach(m=>byKey[m.fkey]=m);

 const bracket=pairs=>{let cur=pairs,r=0;while(cur.length){const rf=cur.map((pr,s)=>attach({key:`ko-r${r}-s${s}`,stage:'ko',round:r,roundName:rname(cur.length),home:pr[0],away:pr[1]}));rf.forEach(f=>f.winner=winnerOf(f));out.rounds.push(rf);if(cur.length===1){const f=rf[0];if(f.winner&&real(f.home)&&real(f.away)){out.finished=true;out.champion=f.winner;out.runnerUp=f.winner===f.home?f.away:f.home;out.final=f}break}const nx=[];for(let i=0;i<rf.length;i+=2)nx.push([rf[i].winner||null,rf[i+1].winner||null]);cur=nx;r++}};
 if(t.format==='liga'){rr(t.order,t.legs).forEach((p,i)=>attach({key:'lg-'+i,stage:'liga',round:p.round,home:p.h,away:p.a}));out.table=tTable(t.order,out.fixtures,null,t.tiebreak);out.phase='Liga';if(out.fixtures.length&&out.fixtures.every(f=>f.match)){out.finished=true;out.champion=out.table[0].id;out.runnerUp=out.table[1]&&out.table[1].id}}
 else if(t.format==='grupos'){let done=true;t.groups.forEach((g,gi)=>{const gf=rr(g,t.legs).map((p,i)=>attach({key:`g${gi}-${i}`,stage:'grupo',group:gi,round:p.round,home:p.h,away:p.a}));if(!gf.every(f=>f.match))done=false;out.groups.push({name:'Grupo '+'ABCDEFGH'[gi],table:tTable(g,gf,null,t.tiebreak),fixtures:gf})});

POST.inicio=()=>{const tr=$('#carTrack');
 if(tr){const n=tr.children.length;let i=0,paused=false,hover=false,tmr=null;const prog=$('#carProg');const durOf=k=>tr.children[k].classList.contains('promo')?8000:10000;
  const sched=()=>{clearTimeout(tmr);prog.classList.remove('run');if(paused||hover||n<2)return;const D=durOf(i);prog.style.setProperty('--dur',D+'ms');void prog.offsetWidth;prog.classList.add('run');tmr=setTimeout(()=>go(i+1),D);carTimers.push(tmr)};
  const go=k=>{i=(k+n)%n;tr.style.transform=`translateX(-${i*100}%)`;[...tr.children].forEach((s,j)=>{s.classList.toggle('on',j===i);s.setAttribute('aria-hidden',j===i?'false':'true');s.querySelectorAll('button,a').forEach(b=>b.tabIndex=j===i?0:-1)});$('#carDots').querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-current',j===i?'true':'false'));sched()};
  const car=tr.parentElement;let fine=false;try{fine=matchMedia('(hover:hover) and (pointer:fine)').matches}catch(e){}
  if(fine){car.addEventListener('mouseenter',()=>{hover=true;sched()});car.addEventListener('mouseleave',()=>{hover=false;sched()})}
  let sx=null;tr.addEventListener('pointerdown',e=>{sx=e.clientX});tr.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>45)go(i+(dx<0?1:-1))});
  ui.car={go:k=>go(k),step:d=>go(i+d),toggle:()=>{paused=!paused;$('#carPause').innerHTML=ic(paused?'play':'pause',16);$('#carPause').setAttribute('aria-label',paused?'Reproducir':'Pausar');sched()}};go(0)}
 const rot=$('#galRot');if(rot){const items=JSON.parse(rot.dataset.items);if(items.length>1){let j=0,front=0;const imgs=rot.querySelectorAll('img');const cap=rot.querySelector('.rot-cap b');
  const iv=setInterval(async()=>{j=(j+1)%items.length;const u=await phURL(items[j][0]);if(!u)return;const back=imgs[1-front];back.src=u;back.classList.add('on');imgs[front].classList.remove('on');front=1-front;cap.textContent=items[j][2];rot.dataset.id=items[j][1]},6000);carTimers.push(iv)}}};

/* ---------- Partidos: helpers y reporte de torneo ---------- */
function matchRow(m,{actions='',showStatus=true}={}){const hw=m.hg>m.ag||(m.hg===m.ag&&m.pen===m.home),aw=m.ag>m.hg||(m.hg===m.ag&&m.pen===m.away);const k=kindOf(m);const tn=tName(m);
 const st=m.status==='aprobado'?`<span class="pill ok">${ic('check')}Aprobado</span>`:m.status==='pendiente'?`<span class="pill pend">${ic('clock')}Pendiente</span>`:m.status==='eliminado'?`<span class="pill mute">${ic('trash')}Eliminado</span>`:`<span class="pill rej">${ic('x')}Rechazado</span>`;
 return `<div class="m ${m.status==='eliminado'?'del':''}"><div class="side"><span class="${hw?'win':aw?'lose':''}">${esc(m.home)}</span>${av(m.home,26)}</div><div class="sc">${m.hg}–${m.ag}${m.pen?`<small>pen. ${esc(m.pen)}</small>`:''}</div><div class="side r2">${av(m.away,26)}<span class="${aw?'win':hw?'lose':''}">${esc(m.away)}</span></div>
 <div class="m-meta"><span>${fmtD(m.date)}</span>${tn?`<span class="pill ${k==='oficial'?'red':'mute'}">${esc(tn)}${k==='externo'?' · externo':''}</span>`:`<span class="pill blue">Amistoso</span>`}${showStatus?st:''}${m.hist&&m.hist.length?`<span class="pill mute" title="Tiene correcciones">${ic('history')}${m.hist.length}</span>`:''}${m.note?`<span>· ${esc(m.note)}</span>`:''}${actions?`<span class="acts">${actions}</span>`:''}</div></div>`}
function openFixturesFor(id){const res=[];S.tournaments.forEach(t=>{const c=computeT(t);c.fixtures.forEach(f=>{if(playable(f)&&(f.home===id||f.away===id)){const pend=S.matches.some(m=>m.status==='pendiente'&&m.tid===t.id&&m.fkey===f.key);res.push({t,f,pend})}})});return res}
const stepper=(id,label,val=0)=>`<div class="field"><label for="${id}" id="${id}L">${label}</label><div class="stepper"><button type="button" class="st" data-act="step" data-t="${id}" data-d="-1" aria-label="Restar un gol">−</button><input type="number" id="${id}" min="0" max="99" inputmode="numeric" value="${val}"><button type="button" class="st" data-act="step" data-t="${id}" data-d="1" aria-label="Sumar un gol">+</button></div></div>`;
const goalsOk=(a,b)=>a!==''&&b!==''&&Number.isInteger(+a)&&Number.isInteger(+b)&&+a>=0&&+b>=0&&+a<=99&&+b<=99;
function fixtureReportModal(tid,key){const t=S.tournaments.find(x=>x.id===tid);const f=t&&computeT(t).fixtures.find(x=>x.key===key);if(!f||!playable(f))return toast('Ese partido de torneo ya no está disponible.');if(S.matches.some(m=>m.status==='pendiente'&&m.tid===tid&&m.fkey===key))return toast('Ya hay un resultado de este partido en revisión.');const my=S.me,opp=f.home===my?f.away:f.home;
 openModal('Registrar resultado',`<form id="fxForm" class="fgrid" novalidate><input type="hidden" id="fxT" value="${tid}"><input type="hidden" id="fxK" value="${key}"><div class="admin-q"><b>${esc(t.name)}</b> · ${esc(stageLabel(f))}<br><span class="sub">Tu partido contra ${esc(opp)}</span></div>
 <div class="score-in">${stepper('fxMy','Tus goles')}<span class="dash">–</span>${stepper('fxOp','Goles de '+esc(opp))}</div>
 <div class="field" id="fxPenBox" hidden data-ko="${f.stage==='ko'?'1':''}"><label for="fxPen">Ganador por penales</label><select id="fxPen"><option value="">Elige quién ganó en penales</option><option value="${esc(my)}">${esc(my)}</option><option value="${esc(opp)}">${esc(opp)}</option></select><span class="hint">En eliminatoria el empate se define por penales.</span></div>
 <div class="fgrid two"><div class="field"><label for="fxDate">Fecha</label><input type="date" id="fxDate" value="${todayStr()}" max="${todayStr()}"></div><div class="field"><label for="fxNote">Nota (opcional)</label><input type="text" id="fxNote" maxlength="80"></div></div>
 <div class="err" id="fxErr"></div><div class="modal-foot"><button type="button" class="btn ghost" data-act="close-modal">Cancelar</button><button class="btn primary" type="submit">${ic('check')}Enviar para aprobación</button></div></form>`)}
function updPen(){const b=$('#fxPenBox');if(!b)return;b.hidden=!(b.dataset.ko==='1'&&$('#fxMy').value!==''&&$('#fxMy').value===$('#fxOp').value)}
function submitFixture(){const tid=$('#fxT').value,key=$('#fxK').value,a=$('#fxMy').value,b=$('#fxOp').value,d=$('#fxDate').value,err=$('#fxErr');const t=S.tournaments.find(x=>x.id===tid);const f=t&&computeT(t).fixtures.find(x=>x.key===key);
 if(!f||!playable(f))return err.textContent='Ese partido de torneo ya no está disponible.';if(!goalsOk(a,b))return err.textContent='Escribe goles entre 0 y 99.';if(!d||d>todayStr())return err.textContent='La fecha no puede ser futura.';
 let hg=+a,ag=+b;if(f.home!==S.me){hg=+b;ag=+a}let pen=null;if(f.stage==='ko'&&hg===ag){pen=$('#fxPen').value;if(!pen)return err.textContent='Indica quién ganó en penales.'}

const hjT=()=>+(S.settings.hjDiff||3),hjMin=()=>+(S.settings.hjMin||4);
function friendlyMatches(r){return approvedSorted().filter(m=>kindOf(m)==='amistoso'&&!isGuest(m.home)&&!isGuest(m.away)&&inR(m.date,r))}
function pairStats(r){const map={};friendlyMatches(r).forEach(m=>{const [a,b]=[m.home,m.away].sort();const k=a+'|'+b;const p=map[k]=map[k]||{a,b,pj:0,wa:0,wb:0,d:0,ga:0,gb:0,ms:[]};const ga=m.home===a?m.hg:m.ag,gb=m.home===a?m.ag:m.hg;p.pj++;p.ga+=ga;p.gb+=gb;if(ga>gb)p.wa++;else if(gb>ga)p.wb++;else p.d++;p.ms.push(m)});
 const T=hjT(),MIN=hjMin();return Object.values(map).map(p=>{const diff=p.wa-p.wb;let dad=null,son=null,level=null;if(p.pj>=MIN&&Math.abs(diff)>=T){dad=diff>0?p.a:p.b;son=diff>0?p.b:p.a;level=Math.abs(diff)>=2*T?'abuelo':'papa'}return Object.assign(p,{diff,dad,son,level,absd:Math.abs(diff)})})}
const side=(p,id)=>p.a===id?{w:p.wa,l:p.wb,gf:p.ga,gc:p.gb,opp:p.b}:{w:p.wb,l:p.wa,gf:p.gb,gc:p.ga,opp:p.a};
function family(id,pairs){const kids=[],dads=[];pairs.forEach(p=>{if(p.dad===id)kids.push(p);else if(p.son===id)dads.push(p)});return {kids:kids.sort((a,b)=>b.absd-a.absd),dads:dads.sort((a,b)=>b.absd-a.absd)}}
function fResults(id,ms){return ms.filter(m=>m.home===id||m.away===id).map(m=>{const f=m.home===id?m.hg:m.ag,a=m.home===id?m.ag:m.hg;return f>a?'G':f<a?'P':'E'})}
function activeRun(list,res){let n=0;for(let i=list.length-1;i>=0&&list[i]===res;i--)n++;return n}
const capFor=m=>{const d=Math.abs(m.hg-m.ag),t=m.hg+m.ag;return d>=5?['cap','Humillación total']:d>=3?['cap','Paliza']:d===2?['cap b','Sin discusión']:d===1?['cap b','Por la mínima']:t>=6?['cap m','Partidazo']:['cap m','Empate, nadie llora']};

 if(A===B)return `<div class="verdict"><div class="lab">Prueba de paternidad</div><h3>Elige dos jugadores distintos</h3></div>`;
 if(!p)return `<div class="verdict"><div class="lab">Prueba de paternidad</div><h3>Sin historial</h3><p class="sub" style="margin:0">${esc(A)} y ${esc(B)} nunca se han enfrentado en un amistoso. ¿Qué esperan para arreglarlo en la cancha?</p></div>`;
 const sa=side(p,A),sb=side(p,B);const rec=`<div class="row" style="justify-content:center;margin-top:12px">${av(A,44)}<span class="disp" style="font-size:34px">${sa.w} – ${p.d} – ${sb.w}</span>${av(B,44)}</div><p class="sub" style="margin:6px 0 0">${esc(A)} ${sa.w} victorias · ${p.d} empates · ${sb.w} victorias ${esc(B)} · Goles ${sa.gf}–${sb.gf} · ${p.pj} amistosos</p>`;
 if(p.pj<MIN)return `<div class="verdict"><div class="lab">Prueba de paternidad</div><h3>Prueba pendiente</h3><p style="margin:0">Llevan ${p.pj} amistoso${p.pj===1?'':'s'}. Faltan ${MIN-p.pj} más para que el laboratorio dé un resultado.</p>${rec}</div>`;
 if(p.dad){const pct=Math.round(Math.max(p.wa,p.wb)/p.pj*100);const need=p.absd-T+1;return `<div class="verdict"><div class="lab">Resultado de la prueba de ADN</div><h3><em>${esc(p.dad)}</em> es ${p.level==='abuelo'?'el abuelo':'el papá'} de ${esc(p.son)}</h3><p style="margin:0">${p.level==='abuelo'?'Dominio total. Esto ya es herencia familiar.':'Prueba positiva. Que alguien le avise a la familia.'}</p><div class="dna" role="img" aria-label="Compatibilidad paterna ${pct}%"><i style="width:${pct}%"></i></div><span class="sub">Compatibilidad paterna: <b style="color:var(--text)">${pct}%</b></span>${rec}<p style="margin:12px 0 0"><b>${esc(p.son)}</b>: te falta${need===1?'':'n'} <b>${need}</b> victoria${need===1?'':'s'} neta${need===1?'':'s'} para quitarle la paternidad. Nada es para siempre.</p></div>`}
 return `<div class="verdict"><div class="lab">Resultado de la prueba de ADN</div><h3>Serie pareja</h3><p style="margin:0">Nadie es papá de nadie… todavía. El primero que saque ${T} victorias de ventaja se queda con el título.</p>${rec}</div>`}

 ${list.length?`<div class="cards stagger">${list.map(t=>{const c=computeT(t);const ext=t.official===false;const played=c.fixtures.filter(f=>f.match).length,total=c.fixtures.filter(f=>real(f.home)&&real(f.away)).length;return `<button class="tcard ${ext?'ext':''}" data-act="open-t" data-id="${t.id}"><div class="row" style="justify-content:space-between;width:100%"><span class="row" style="gap:6px"><span class="pill ${c.finished?'gold':'pend'}">${c.finished?ic('trophy')+'Finalizado':ic('clock')+c.phase}</span><span class="pill ${ext?'mute':'red'}">${ext?'Externo':'Válido'}</span>${t.prize&&t.prize.on?`<span class="pill gold">${ic('trophy')}Con premio</span>`:''}</span></div><h3>${esc(t.name)}</h3><div class="sub">${FMT[t.format]} · ${t.order.length} jugadores${ext?'':` · campeón +${bonusFor(t.format)} pts`}</div>${c.finished?`<div class="champ">${av(c.champion,24)}Campeón: <b>${esc(c.champion)}</b></div>`:`<div class="progress" aria-label="${played} de ${total} partidos"><i style="width:${total?played/total*100:0}%"></i></div><div class="sub num">${played} de ${total} partidos jugados</div>`}</button>`}).join('')}</div>`:`<div class="panel empty">Todavía no hay torneos.</div>`}
 ${hist.length?`<div class="panel" style="margin-top:18px"><h2>${ic('history')}Campeones históricos<span class="count">importados</span></h2><div class="mlist">${hist.map(h=>`<div class="m" style="grid-template-columns:1fr auto"><div class="who">${av(h.champion,32)}<div><b>${esc(h.name)}</b><div class="sub">Campeón: ${esc(h.champion)}${h.runnerUp?' · Subcampeón: '+esc(h.runnerUp):''} · ${FMT_S[h.format]} · ${fmtD(h.date)}</div></div></div><span class="pill ${h.official===false?'mute':'red'}">${h.official===false?'Externo':'Válido'}</span></div>`).join('')}</div></div>`:''}`};
function fixtureLine(f){const w=f.winner||(f.match?winnerOf(f):null);const m=f.match;const g=id=>m?(m.home===id?m.hg:m.ag):'';const pend=!m&&S.matches.find(x=>x.status==='pendiente'&&x.tid===ui.tId&&x.fkey===f.key);const adm=isAdmin();let acts='';
 if(m){if(adm)acts=`<span class="pill ok">${ic('check')}Aprobado</span><span class="acts"><button class="btn sm" data-act="edit-m" data-id="${m.id}">${ic('edit')}Editar</button></span>`}
 else if(pend)acts=`<span class="pill pend">${ic('clock')}Resultado en revisión: ${pend.hg}–${pend.ag}</span>${adm?`<span class="acts"><button class="btn sm okb" data-act="approve" data-id="${pend.id}">${ic('check')}Aprobar</button><button class="btn sm" data-act="edit-m" data-id="${pend.id}">${ic('edit')}</button></span>`:''}`;
 else if(real(f.home)&&real(f.away)){acts=`<span class="pill mute">Por jugar</span>`;if(adm)acts+=`<span class="acts"><button class="btn sm" data-act="admin-add" data-t="${ui.tId}" data-k="${f.key}">${ic('plus')}Cargar resultado</button></span>`;else if(S.me===f.home||S.me===f.away)acts+=`<span class="acts"><button class="btn sm primary" data-act="report-fixture" data-t="${ui.tId}" data-k="${f.key}">Registrar resultado</button></span>`}
 return `<div class="m"><div class="side"><span class="${w===f.home?'win':w?'lose':''}">${nm(f.home)}</span>${real(f.home)?av(f.home,24):''}</div><div class="sc">${m?`${g(f.home)}–${g(f.away)}${m.pen?`<small>pen. ${esc(m.pen)}</small>`:''}`:`<span style="color:var(--faint)">vs</span>`}</div><div class="side r2">${real(f.away)?av(f.away,24):''}<span class="${w===f.away?'win':w?'lose':''}">${nm(f.away)}</span></div>${acts?`<div class="m-meta">${acts}</div>`:''}</div>`}
function groupTable(rows,adv){return `<div class="tscroll"><table class="t"><thead><tr><th class="l">#</th><th class="l">Jugador</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>DG</th><th>Pts</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="l pos">${adv&&i<adv?`<span class="md" style="--medal:#6EA6FF">${i+1}</span>`:i+1}</td><td class="l"><span class="who">${av(r.id,24)}<b>${esc(r.id)}</b>${guestTag(r.id)}</span></td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.dg>0?'+':''}${r.dg}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table></div>`}
function bracketView(rounds){return `<div class="bracket">${rounds.map(rf=>`<div class="round"><h4>${esc(rf[0].roundName)}</h4><div class="col">${rf.map(f=>{const m=f.match;const g=id=>m?(m.home===id?m.hg:m.ag):'';const ln=id=>{const cls=!real(id)?'tbd':f.winner?(f.winner===id?'w':'l'):'';return `<div class="ln ${cls}">${real(id)?av(id,20):''}<span>${nm(id)}</span><b>${m?g(id):''}</b></div>`};return `<div class="bm">${ln(f.home)}${ln(f.away)}${m&&m.pen?`<div class="pen">Penales: ${esc(m.pen)}</div>`:''}</div>`}).join('')}</div></div>`).join('')}</div>`}
function tournamentView(t){const c=computeT(t);const ext=t.official===false;const tabs=[];if(t.format==='grupos'){tabs.push(['grupos','Grupos']);tabs.push(['llaves','Eliminatoria'])}if(t.format==='ko')tabs.push(['llaves','Llaves']);if(t.format==='liga'||t.format==='suizo')tabs.push(['tabla','Tabla']);tabs.push(['partidos','Partidos']);tabs.push(['info','Reglas y premios']);if(!tabs.some(x=>x[0]===ui.tTab))ui.tTab=tabs[0][0];
 const np=c.fixtures.filter(f=>real(f.home)&&real(f.away));let body='';
